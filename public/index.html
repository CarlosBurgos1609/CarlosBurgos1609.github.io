<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Portafolio CABJ</title>
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Electric border SVG filter defs (global) with continuous smooth animation -->
    <svg width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true" focusable="false">
      <defs>
        <filter id="electric-displace" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
          <!-- Continuous turbulence animation -->
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="8" result="noise" seed="5">
            <animate attributeName="baseFrequency" 
                     values="0.015;0.020;0.015" 
                     dur="3s" 
                     repeatCount="indefinite"/>
          </feTurbulence>
          
          <!-- Continuous circular offset movement -->
          <feOffset in="noise" result="offsetNoise">
            <animate attributeName="dx" 
                     values="0;50;0;-50;0" 
                     dur="4s" 
                     repeatCount="indefinite" 
                     calcMode="spline"
                     keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
            <animate attributeName="dy" 
                     values="-50;0;50;0;-50" 
                     dur="4s" 
                     repeatCount="indefinite"
                     calcMode="spline"
                     keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
          </feOffset>
          
          <!-- Apply displacement with moderate scale for electric effect -->
          <feDisplacementMap in="SourceGraphic" in2="offsetNoise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
  </body>
</html>
